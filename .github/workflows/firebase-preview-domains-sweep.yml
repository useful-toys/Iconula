#
# Varredura diária dos authorized domains do Firebase Auth: remove todo host
# de preview (iconula--*.web.app) que não tenha mais canal de Hosting ativo.
# É a rede de segurança do cleanup_preview (firebase-hosting-pull-request.yml)
# e acompanha a expiração de 3 dias dos canais, que o Firebase faz sozinho
# no Hosting mas não reflete nos authorized domains — ver DDR 0008.

name: Sweep preview authorized domains
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep_preview_domains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preparar credencial da service account
        env:
          FIREBASE_SERVICE_ACCOUNT_ICONULA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ICONULA }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_ICONULA" > "$RUNNER_TEMP/sa.json"
          echo "SA_PATH=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Remover domínios de preview sem canal ativo
        run: bash .github/scripts/dominios-autorizados-preview.sh varrer
      - name: Remover credencial da service account
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

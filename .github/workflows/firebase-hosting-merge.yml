# Copyright (c) 2026 Daniel Felix Ferber
#
# Deploy para produção no Firebase Hosting a cada push/merge na branch main.
#
# Também publica as regras de segurança do Firestore: a action
# FirebaseExtended/action-hosting-deploy só cobre Hosting, e regras não têm
# canal de preview (são globais do projeto), então o merge é o único ponto
# onde elas sobem — ver docs/tdr/0008-deploy-e-teste-das-regras-do-firestore.md.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci && npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      # A credencial vai para $RUNNER_TEMP, nunca para o workspace, e é
      # apagada no fim do job. Mesmo padrão do cleanup_preview em
      # firebase-hosting-pull-request.yml.
      - name: Preparar credencial da service account
        env:
          FIREBASE_SERVICE_ACCOUNT_ICONULA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ICONULA }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_ICONULA" > "$RUNNER_TEMP/sa.json"
          echo "SA_PATH=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # Antes do deploy de Hosting: se as regras falharem, o cliente novo
      # nem chega a subir. A versão do firebase-tools é fixada de
      # propósito — é um pacote npm executado com a chave da service
      # account no ambiente, e uma tag móvel aí é o mesmo risco que o
      # pinning por SHA fecha para as actions (ver TDR 0006 e TDR 0008).
      - name: Deploy das regras do Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.SA_PATH }}
        run: npx --yes firebase-tools@15.29.0 deploy --only firestore:rules --project iconula --non-interactive

      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_ICONULA }}"
          channelId: live
          projectId: iconula

      - name: Remover credencial da service account
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

#
# Lint + testes. Roda em todo PR e em todo push na main, inclusive para PRs
# de fork (não tem acesso a secrets, e não precisa).

name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # O emulador do Firestore roda na JVM e o firebase-tools exige JDK
      # 21+. A imagem do runner traz mais de um JDK e o default pode
      # mudar entre versões da imagem — fixar a versão aqui evita que os
      # testes de regras quebrem por troca de imagem (ver TDR 0008).
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      # Regras de segurança do Firestore contra o emulador. Não usa
      # secret nenhum (projeto `demo-`, emulador offline), então continua
      # valendo para PR de fork — ver TDR 0008.
      - run: npm run test:rules
      - run: npm run build

# Copyright (c) 2026 Daniel Felix Ferber
#
# Preview deploy no Firebase Hosting para todo pull request. Este workflow
# é configurado como required status check da branch main (ver
# docs/adr/0004-branch-protection-preview-required.md): PRs só podem ser
# mesclados se este job passar com sucesso. Lint e testes rodam
# separadamente em ci.yml (ver docs/tdr/0004-ci-roda-lint-e-testes.md).
#
# O canal de preview usa channelId explícito ("pr<número>") para que o job
# de limpeza (cleanup_preview, abaixo) saiba exatamente qual canal apagar
# quando o PR fecha — sem depender do nome default que a action deriva do
# branch. Como rede de segurança contra PRs cujo cleanup falhe ou nunca
# rode (merge sem fechar o evento, workflow desabilitado etc.), o canal
# também expira sozinho em 3 dias.

name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  build_and_preview:
    if: ${{ github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # FirebaseExtended/action-hosting-deploy usa o repoToken (GITHUB_TOKEN)
    # para comentar o PR com o link do preview (pull-requests: write) e
    # para criar/atualizar um check run "Deploy Preview" (checks: write) —
    # confirmado em produção: sem checks: write a action falha com 403
    # "Resource not accessible by integration" ao criar o check run.
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # --ignore-scripts: mesma postura de ci.yml (TDR/DDR de supply chain)
      # — postinstall de dependência não roda código arbitrário no job, que
      # aqui carrega a credencial da service account de deploy mais adiante.
      - run: npm ci --ignore-scripts && npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_ICONULA }}"
          projectId: iconula
          channelId: "pr${{ github.event.number }}"
          expires: 3d
      # O host do canal (iconula--pr<N>-<hash>.web.app) não entra sozinho nos
      # authorized domains do Firebase Auth, e sem ele o login no preview
      # falha com auth/unauthorized-domain. A autorização dura o mesmo que o
      # canal: sai quando o PR fecha (cleanup_preview) e na varredura diária
      # de firebase-preview-domains-sweep.yml — ver DDR 0008.
      - name: Preparar credencial da service account
        env:
          FIREBASE_SERVICE_ACCOUNT_ICONULA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ICONULA }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_ICONULA" > "$RUNNER_TEMP/sa.json"
          echo "SA_PATH=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Autorizar o domínio do preview no Firebase Auth
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.details_url }}
        run: bash .github/scripts/dominios-autorizados-preview.sh adicionar "$PREVIEW_URL"
      - name: Remover credencial da service account
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

  cleanup_preview:
    if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      # O checkout é obrigatório: `firebase hosting:channel:delete` exige
      # rodar dentro de um diretório com `firebase.json` (senão falha com
      # "Not in a Firebase app directory"). Sem este passo o job falhava
      # em todo PR fechado, e os canais de preview nunca eram apagados.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - env:
          FIREBASE_SERVICE_ACCOUNT_ICONULA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ICONULA }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_ICONULA" > "$RUNNER_TEMP/sa.json"
          echo "SA_PATH=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      # Versão do firebase-tools fixada: este comando roda com a chave da
      # service account no ambiente, e uma tag móvel (@latest) executando
      # com credencial de deploy é o mesmo risco de cadeia de suprimentos
      # que o pinning por SHA fecha para as actions (ver TDR 0006 e
      # TDR 0008).
      - env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.SA_PATH }}
        run: npx --yes firebase-tools@15.29.0 hosting:channel:delete "pr${{ github.event.number }}" --project iconula --force
      # Roda mesmo se o delete do canal falhar: o domínio não deve continuar
      # autorizado sem um PR aberto por trás dele.
      - name: Remover o domínio do preview dos authorized domains
        if: always()
        run: bash .github/scripts/dominios-autorizados-preview.sh remover-pr "${{ github.event.number }}"
      - name: Remover credencial da service account
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

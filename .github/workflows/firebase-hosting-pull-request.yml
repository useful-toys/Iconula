#
# Preview deploy no Firebase Hosting para todo pull request. Este workflow
# é configurado como required status check da branch main (ver
# docs/adr/0004-branch-protection-preview-required.md): PRs só podem ser
# mesclados se este job passar com sucesso. Lint e testes rodam
# separadamente em ci.yml (ver docs/tdr/0004-ci-roda-lint-e-testes.md).
#
# O canal de preview usa channelId explícito ("pr<número>") para que o job
# de limpeza (cleanup_preview, abaixo) saiba exatamente qual canal apagar
# quando o PR fecha — sem depender do nome default que a action deriva do
# branch. Como rede de segurança contra PRs cujo cleanup falhe ou nunca
# rode (merge sem fechar o evento, workflow desabilitado etc.), o canal
# também expira sozinho em 3 dias.

name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
jobs:
  build_and_preview:
    if: ${{ github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_ICONULA }}"
          projectId: iconula
          channelId: "pr${{ github.event.number }}"
          expires: 3d

  cleanup_preview:
    if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - env:
          FIREBASE_SERVICE_ACCOUNT_ICONULA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ICONULA }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_ICONULA" > "$RUNNER_TEMP/sa.json"
          echo "SA_PATH=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.SA_PATH }}
        run: npx --yes firebase-tools@latest hosting:channel:delete "pr${{ github.event.number }}" --project iconula --force
